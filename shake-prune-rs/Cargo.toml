[package]
name = "shake-prune"
version = "0.1.6"
edition = "2021"
description = "High-performance in-place context compaction and tree-shaking tool for Google Antigravity Agent"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["clock"] }
tempfile = "3.10"
fs2 = "0.4"
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
