[package]
name = "shake-prune"
version = "0.1.1"
edition = "2021"
description = "High-performance context compaction and tree-shaking tool for Google Antigravity Agent"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
