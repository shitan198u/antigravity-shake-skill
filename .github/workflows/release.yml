name: Build, Attest & Release Multi-Platform Binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Build Linux x86_64
  build-linux:
    name: 🐧 Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Build Release Binary
        run: cargo build --release --manifest-path shake-prune-rs/Cargo.toml
      - name: Smoke-Test Release Binary
        run: |
          ./shake-prune-rs/target/release/shake-prune --version
          ./shake-prune-rs/target/release/shake-prune --help
          ./shake-prune-rs/target/release/shake-prune doctor --json
      - name: Package Asset
        run: |
          mkdir -p dist
          cp shake-prune-rs/target/release/shake-prune dist/shake-prune-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: shake-prune-linux-x86_64
          path: dist/shake-prune-linux-x86_64

  # 2. Build Linux aarch64 (ARM64 musl) via cross
  build-linux-arm64:
    name: 🐧 Linux aarch64 (ARM64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Build Cross-Compiled ARM64 Binary
        run: cross build --release --target aarch64-unknown-linux-musl --manifest-path shake-prune-rs/Cargo.toml
      - name: Package Asset
        run: |
          mkdir -p dist
          cp shake-prune-rs/target/aarch64-unknown-linux-musl/release/shake-prune dist/shake-prune-linux-aarch64
          file dist/shake-prune-linux-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: shake-prune-linux-aarch64
          path: dist/shake-prune-linux-aarch64

  # 3. Build macOS Universal (Apple Silicon + Intel via lipo)
  build-macos:
    name: 🍎 macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Build Both macOS Architectures
        run: |
          cargo build --release --target aarch64-apple-darwin --manifest-path shake-prune-rs/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path shake-prune-rs/Cargo.toml
      - name: Create Universal Binary via lipo
        run: |
          mkdir -p dist
          lipo -create -output dist/shake-prune-macos-universal \
            shake-prune-rs/target/aarch64-apple-darwin/release/shake-prune \
            shake-prune-rs/target/x86_64-apple-darwin/release/shake-prune
          file dist/shake-prune-macos-universal
      - name: Smoke-Test Universal Binary
        run: |
          ./dist/shake-prune-macos-universal --version
          ./dist/shake-prune-macos-universal --help
          ./dist/shake-prune-macos-universal doctor --json
      - uses: actions/upload-artifact@v7
        with:
          name: shake-prune-macos-universal
          path: dist/shake-prune-macos-universal

  # 4. Build Windows x86_64 (.exe)
  build-windows:
    name: 🪟 Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Build Windows Release Binary
        run: cargo build --release --manifest-path shake-prune-rs/Cargo.toml
      - name: Smoke-Test Windows Binary
        run: |
          .\shake-prune-rs\target\release\shake-prune.exe --version
          .\shake-prune-rs\target\release\shake-prune.exe doctor --json
      - name: Package Asset
        shell: bash
        run: |
          mkdir -p dist
          cp shake-prune-rs/target/release/shake-prune.exe dist/shake-prune-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: shake-prune-windows-x86_64.exe
          path: dist/shake-prune-windows-x86_64.exe

  # 5. Create Official GitHub Release with Checksums, SBOM & Sigstore Signature
  release:
    name: 🚀 Publish GitHub Release & Sigstore Attestations
    needs: [build-linux, build-linux-arm64, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release_assets/
      - name: Flatten and Generate SHA256 Checksums
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec cp {} final_assets/ \;
          cd final_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify Shipped Artifacts Against Checksums
        run: |
          cd final_assets
          sha256sum -c SHA256SUMS.txt
          test -f shake-prune-linux-x86_64
          test -f shake-prune-linux-aarch64
          test -f shake-prune-macos-universal
          test -f shake-prune-windows-x86_64.exe
          chmod +x shake-prune-linux-* shake-prune-macos-*
          ./shake-prune-linux-x86_64 --version
      - name: Generate CycloneDX SBOM (Precompiled via install-action)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Build SBOM Asset
        run: |
          cargo cyclonedx --manifest-path shake-prune-rs/Cargo.toml --format json --override-filename sbom.cdx
          if [ -f shake-prune-rs/sbom.cdx.json ]; then
            cp shake-prune-rs/sbom.cdx.json final_assets/sbom.cdx.json
          elif [ -f shake-prune-rs/sbom.cdx.json.json ]; then
            cp shake-prune-rs/sbom.cdx.json.json final_assets/sbom.cdx.json
          fi
          test -f final_assets/sbom.cdx.json
      - name: Keyless Cryptographic Signing via Sigstore/Cosign (Free OIDC)
        uses: sigstore/cosign-installer@v3
      - name: Sign Checksums
        run: |
          cd final_assets
          cosign sign-blob --yes SHA256SUMS.txt --bundle SHA256SUMS.txt.sigstore.json
      - name: Publish Official Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: final_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
