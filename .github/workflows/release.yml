name: Build, Test & Release Multi-Platform Binaries

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # 1. Build & Test Linux x86_64
  build-linux:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Test Suite
        run: cargo test --manifest-path shake-prune-rs/Cargo.toml
      - name: Build Release
        run: cargo build --release --manifest-path shake-prune-rs/Cargo.toml
      - name: Package Asset
        run: |
          mkdir -p dist
          cp shake-prune-rs/target/release/shake-prune dist/shake-prune-linux-x86_64
      - name: Test install.sh and Uninstallation
        run: |
          mkdir -p bin
          cp dist/shake-prune-linux-x86_64 bin/shake-prune
          chmod +x bin/shake-prune install.sh
          ./install.sh
          ~/.gemini/bin/shake-prune --version
          ./install.sh --uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: shake-prune-linux-x86_64
          path: dist/shake-prune-linux-x86_64

  # 2. Build & Test macOS Universal (ARM64 + Intel x86_64 via lipo on macos-latest)
  build-macos:
    name: Build & Test (macOS Universal - Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build Both Targets
        run: |
          cargo build --release --target aarch64-apple-darwin --manifest-path shake-prune-rs/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path shake-prune-rs/Cargo.toml
      - name: Create Universal Binary via lipo
        run: |
          mkdir -p dist
          lipo -create -output dist/shake-prune-macos-universal \
            shake-prune-rs/target/aarch64-apple-darwin/release/shake-prune \
            shake-prune-rs/target/x86_64-apple-darwin/release/shake-prune
          file dist/shake-prune-macos-universal
      - name: Test install.sh and Uninstallation on macOS
        run: |
          mkdir -p bin
          cp dist/shake-prune-macos-universal bin/shake-prune
          chmod +x bin/shake-prune install.sh
          ./install.sh
          ~/.gemini/bin/shake-prune --version
          ./install.sh --uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: shake-prune-macos-universal
          path: dist/shake-prune-macos-universal

  # 3. Build & Test Windows x86_64
  build-windows:
    name: Build & Test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --manifest-path shake-prune-rs/Cargo.toml
      - name: Package Asset
        shell: bash
        run: |
          mkdir -p dist
          cp shake-prune-rs/target/release/shake-prune.exe dist/shake-prune-windows-x86_64.exe
      - name: Test install.ps1 and Uninstallation on Windows
        shell: powershell
        run: |
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" -Force }
          Copy-Item dist\shake-prune-windows-x86_64.exe bin\shake-prune.exe -Force
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          & "$env:USERPROFILE\.gemini\bin\shake-prune.exe" --version
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall
      - uses: actions/upload-artifact@v4
        with:
          name: shake-prune-windows-x86_64.exe
          path: dist/shake-prune-windows-x86_64.exe

  # 4. Automatic GitHub Release on Tags
  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release_assets/
      - name: Flatten and Generate Checksums
        run: |
          mkdir -p final_assets
          find release_assets/ -type f -exec cp {} final_assets/ \;
          cd final_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Package & Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
