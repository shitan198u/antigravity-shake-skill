name: Fast Feedback CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. Smart Path Filtering: Skip compilation if only documentation or templates changed
  analyze-changes:
    name: 🔍 Analyze Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'shake-prune-rs/**'
              - 'bin/**'
              - 'install.sh'
              - 'install.ps1'
              - 'scripts/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
  # 2. Static Analysis & Lint Gates
  quality:
    name: 🦀 Quality & Security Gates
    runs-on: ubuntu-latest
    needs: analyze-changes
    if: needs.analyze-changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Verify Formatting (cargo fmt)
        run: cargo fmt --manifest-path shake-prune-rs/Cargo.toml -- --check
      - name: Verify Lints (cargo clippy)
        run: cargo clippy --manifest-path shake-prune-rs/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Install cargo-audit (Precompiled via install-action)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Dependency Security Audit
        run: cargo audit --file shake-prune-rs/Cargo.lock

  # 3. Multi-OS Unit & Integration Tests (Ubuntu, macOS, Windows)
  multi-os-tests:
    name: 🧪 Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: analyze-changes
    if: needs.analyze-changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shake-prune-rs
      - name: Run Automated Test Suite
        run: cargo test --manifest-path shake-prune-rs/Cargo.toml
      - name: Test Native Release Build & Local Installer (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --manifest-path shake-prune-rs/Cargo.toml
          mkdir -p bin
          cp shake-prune-rs/target/release/shake-prune bin/shake-prune
          chmod +x bin/shake-prune install.sh
          SHAKE_LOCAL_DEV=1 ./install.sh
          ~/.gemini/bin/shake-prune --version
          ~/.gemini/bin/shake-prune doctor --json
          test -x ~/.gemini/bin/shake-uninstall
          ~/.gemini/bin/shake-uninstall
          # Verify ./install.sh --uninstall as well
          SHAKE_LOCAL_DEV=1 ./install.sh
          ./install.sh --uninstall
      - name: Test Native Release Build & Local Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cargo build --release --manifest-path shake-prune-rs/Cargo.toml
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" -Force }
          Copy-Item shake-prune-rs\target\release\shake-prune.exe bin\shake-prune.exe -Force
          $env:SHAKE_LOCAL_DEV = "1"
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          & "$env:USERPROFILE\.gemini\bin\shake-prune.exe" --version
          & "$env:USERPROFILE\.gemini\bin\shake-prune.exe" doctor --json
          if (!(Test-Path "$env:USERPROFILE\.gemini\bin\shake-uninstall.cmd")) { throw "shake-uninstall.cmd missing" }
          & "$env:USERPROFILE\.gemini\bin\shake-uninstall.cmd"
          # Verify .\install.ps1 -Uninstall as well
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Uninstall

  # 4. PR Dependency Review
  dependency-review:
    name: 🛡️ Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: analyze-changes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # 5. Status Aggregator & PR Summary Comment Bot
  ci-summary:
    name: ✅ CI Summary & PR Feedback
    runs-on: ubuntu-latest
    needs: [analyze-changes, quality, multi-os-tests]
    if: always()
    steps:
      - name: Verify All Job Statuses
        id: status-check
        run: |
          CODE_CHANGED="${{ needs.analyze-changes.outputs.code }}"
          QUALITY_STATUS="${{ needs.quality.result }}"
          TESTS_STATUS="${{ needs.multi-os-tests.result }}"

          echo "Code Changed: $CODE_CHANGED"
          echo "Quality Status: $QUALITY_STATUS"
          echo "Tests Status: $TESTS_STATUS"

          if [[ "$CODE_CHANGED" != "true" ]]; then
            echo "is_doc_only=true" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Documentation/template-only change (skipping full compilation matrix)"
            exit 0
          fi

          echo "is_doc_only=false" >> $GITHUB_OUTPUT
          if [[ "$QUALITY_STATUS" == "success" && "$TESTS_STATUS" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ All quality checks and multi-OS tests passed!"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Some CI checks failed"
            exit 1
          fi

      - name: Post or Update PR Feedback Comment
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const isDocOnly = '${{ steps.status-check.outputs.is_doc_only }}' === 'true';
            const isSuccess = '${{ steps.status-check.outputs.status }}' === 'success';

            const commentBody = isDocOnly
              ? `### 📝 Fast Feedback: Passed (Documentation)\n\nThis PR contains only documentation or template changes — code compilation was skipped to save runner minutes.\n\n**Status:** ✅ Ready for review.`
              : isSuccess
                ? `### 🚀 Fast Feedback: All Checks Passed!\n\nAll automated gates passed cleanly across platforms:\n- ✅ **Multi-OS Tests** (Ubuntu, macOS, Windows)\n- ✅ **Static Analysis** (\`cargo clippy -- -D warnings\` / \`cargo fmt -- --check\`)\n- ✅ **Installer Validation** (\`install.sh\` and \`install.ps1\` installation & doctor checks)\n- ✅ **Security Audit** (\`cargo-audit\`)\n\n**Status:** ✅ Ready to merge!`
                : `### ❌ Fast Feedback: Checks Failed\n\nOne or more CI jobs encountered errors. Please review the workflow logs above for details.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && (c.body.includes('Fast Feedback: All Checks Passed') || c.body.includes('Fast Feedback:'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
